name: Build Tango32 Kernel Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 替换为当前稳定可用的 Setup NDK Action
      - name: Set up Android NDK
        uses: nsetup/setup-android-ndk@v1.3.1
        with:
          ndk-version: r26b

      - name: Set up Clang & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm libssl-dev

      - name: Build Module
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_ROOT
          chmod +x ./build.sh || true
          if [ -f "./build.sh" ]; then
            ./build.sh
          else
            make -j$(nproc)
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tango32-built-artifacts
          path: |
            *.ko
            out/
            build/
            dist/
          if-no-files-found: warn
